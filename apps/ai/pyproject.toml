[project]
name = "hris-ai-service"
version = "0.1.0"
description = "HRIS AI Service — Modular Retrieval-Augmented Generation (RAG) Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0.0,<6.0.0",
    "langchain-text-splitters>=0.2.0,<0.4.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
