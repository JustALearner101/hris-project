name: HRIS Monorepo CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend CI (.NET 9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore apps/api/Hris.Backend.sln

      - name: Build Backend
        run: dotnet build apps/api/Hris.Backend.sln --no-restore -c Release

  frontend-ci:
    name: Frontend CI (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Frontend
        run: pnpm --filter ./apps/web lint

      - name: Build Frontend
        run: pnpm --filter ./apps/web build

  ai-service-ci:
    name: AI Service CI (Python 3.12 / uv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock

      - name: Install Dependencies
        run: uv sync --frozen --directory apps/ai

      - name: Run Tests
        run: uv run --directory apps/ai pytest

      - name: Verify Scaffold
        run: uv run --directory apps/ai python scripts/verify_scaffold.py

  contracts-drift:
    name: Contracts Drift Check (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Backend
        run: dotnet build apps/api/Hris.Backend.sln -c Release

      - name: Export OpenAPI snapshot
        run: |
          dotnet run --project apps/api/src/Services/Master/hris-be --no-build -c Release --urls http://localhost:8080 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/swagger/v1/swagger.json -o packages/contracts/openapi/swagger.json && break
            sleep 2
          done
          test -s packages/contracts/openapi/swagger.json

      - name: Regenerate contract types
        run: pnpm --filter @hris/contracts generate

      - name: Fail if contracts drifted
        run: git diff --exit-code -- packages/contracts

  docker-build-push:
    name: Docker Build & Push
    needs: [backend-ci, frontend-ci, ai-service-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hris-client:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hris-api:latest

      - name: Build and Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hris-ai:latest
