# docker-compose untuk HRIS Monorepo (Frontend Next.js + Backend ASP.NET Core + Service Pendukung)
# Infra layer — jalankan dari repo root: docker compose -f infra/docker-compose.yml ...

version: "3.9"
name: hris

networks:
  hris:
    driver: bridge

volumes:
  db_data:
  pnpm-store:

services:
  # ========================================
  # Frontend (Next.js) - Mode Production
  # Command: docker compose --profile prod up --build web
  # ========================================
  web:
    build:
      context: ../apps/web
      target: runner
    image: hris-client:prod
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - api
    networks:
      - hris
    profiles: ["prod"]

  # ========================================
  # Frontend (Next.js) - Mode Development (Hot Reload)
  # Command: docker compose --profile dev up --build web-dev
  # ========================================
  web-dev:
    build:
      context: ../apps/web
      target: dev
    image: hris-client:dev
    command: pnpm dev -- -p 3000 --turbo
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - ../apps/web:/app
      - pnpm-store:/root/.local/share/pnpm
    depends_on:
      - api
      - db
      - redis
      - keycloak
    networks:
      - hris
    profiles: ["dev"]

  # ========================================
  # Backend API (ASP.NET Core Web API)
  # ========================================
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: hris-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=hris;Username=hris;Password=hris"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - keycloak
    networks:
      - hris
    profiles: ["dev", "prod"]

  # ========================================
  # Database (PostgreSQL 16)
  # ========================================
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hris
    profiles: ["dev", "prod"]

  # ========================================
  # Redis Cache / Session
  # ========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hris
    profiles: ["dev", "prod"]

  # ========================================
  # AI / RAG Service (FastAPI + ChromaDB + BGE-M3)
  # ========================================
  ai:
    build:
      context: ../apps/ai
      dockerfile: Dockerfile
    image: hris-ai:latest
    environment:
      APP_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ai.sumopod.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MODEL_CACHE_DIR: /app/data/cache/models
    ports:
      - "8000:8000"
    volumes:
      - ../apps/ai/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hris
    profiles: ["dev", "prod"]

  # ========================================
  # Keycloak (SSO)
  # ========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --http-port=8081
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    networks:
      - hris
    profiles: ["dev", "prod"]
